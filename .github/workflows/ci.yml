# === CI — LibroMágico ===
# Ejecuta en cada push y pull request:
#   1. Tests Java (suite completa con Flyway/H2)
#   2. Suite E2E de Playwright contra el stack real (PostgreSQL + MailHog)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------
  # 1. Tests de backend (Java / Maven)
  # ---------------------------------------------------------------
  test:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests with coverage gate
        # El perfil coverage ejecuta la suite completa y aplica la barrera
        # JaCoCo (>=70% instrucciones) definida en pom.xml.
        run: mvn -B -Pcoverage verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reports
          path: target/surefire-reports/

  # ---------------------------------------------------------------
  # 2. E2E de Playwright contra el stack real (app + postgres + mailhog)
  # ---------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Limpieza previa por si el runner quedó con contenedores de un run cancelado.
      - name: Clean leftover stack (idempotent)
        run: docker compose down -v || true

      # Levantar el stack dev con datos frescos (volumen nuevo por run).
      # El perfil dev siembra usuarios/libros/deudas y usa MailHog (email de reset).
      - name: Start app stack (PostgreSQL + MailHog)
        run: |
          docker compose up -d --build
          # Esperar a que el healthcheck de compose marque la app como healthy
          APP_HEALTHY=false
          for i in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' libromagico-app 2>/dev/null || echo "starting")
            echo "poll $i: app health=$status"
            if [ "$status" = "healthy" ]; then
              APP_HEALTHY=true
              break
            fi
            sleep 5
          done
          if [ "$APP_HEALTHY" != "true" ]; then
            echo "::error::La app no llegó a healthy a tiempo"
            docker compose ps
            docker logs libromagico-app --tail 50
            exit 1
          fi
          curl -fsS http://localhost:8080/api/health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run E2E suite
        working-directory: tests/e2e
        run: |
          # pipefail: si pytest falla, el job falla (tee no enmascara el exit code)
          set -o pipefail
          pytest -v | tee e2e-report.txt

      - name: Upload E2E report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/e2e/e2e-report.txt
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # 3. Backup/Restore de PostgreSQL: prueba los scripts reales
  #    (scripts/backup.sh y scripts/restore.sh) contra Postgres con Docker.
  # ---------------------------------------------------------------
  backup-restore:
    name: Backup/Restore (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contenedor fuente con datos de prueba (expone el puerto 5433 en el host).
      - name: Start source DB with seed data
        run: |
          docker run -d --name pg-src \
            -e POSTGRES_USER=libromagico \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=libromagico \
            -p 5433:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            # Sonda con psql: pg_isready responde OK durante el init del server,
            # antes de que exista la base libromagico (race).
            if docker exec pg-src psql -U libromagico -d libromagico -tAc "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec pg-src psql -U libromagico -d libromagico \
            -c "CREATE TABLE libros(id serial PRIMARY KEY, titulo text NOT NULL); INSERT INTO libros(titulo) VALUES ('El principito');"

      # Genera el dump con el script real. Se ejecuta DENTRO de postgres:16-alpine
      # (igual que en prod) para que pg_dump y el server coincidan de versión:
      # un pg_dump del host (más nuevo) emite "SET transaction_timeout" que PG16 no entiende.
      - name: Run backup script
        run: |
          mkdir -p tmp-backups
          chmod +x scripts/backup.sh
          docker run --rm --network host \
            -e PGHOST=localhost -e PGPORT=5433 \
            -e PGUSER=libromagico -e PGPASSWORD=test -e PGDATABASE=libromagico \
            -e BACKUP_DIR=/backups \
            -v "$PWD/scripts/backup.sh:/usr/local/bin/backup.sh:ro" \
            -v "$PWD/tmp-backups:/backups" \
            --entrypoint /usr/local/bin/backup.sh \
            postgres:16-alpine
          ls -l tmp-backups/

      # Contenedor destino vacío (puerto 5434) y restore del dump generado.
      - name: Restore dump into target DB
        run: |
          docker run -d --name pg-dst \
            -e POSTGRES_USER=libromagico \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=libromagico \
            -p 5434:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            # Sonda con psql (ver nota en "Start source DB with seed data").
            if docker exec pg-dst psql -U libromagico -d libromagico -tAc "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          RESTORE_FILE="$(ls "$PWD"/tmp-backups/libromagico_*.sql.gz | head -1)"
          chmod +x scripts/restore.sh
          # restore.sh corre dentro de postgres:16-alpine (psql de la misma versión
          # que el server) y lee el dump desde el bind mount /backups.
          docker run --rm --network host \
            -e PGHOST=localhost -e PGPORT=5434 \
            -e PGUSER=libromagico -e PGPASSWORD=test -e PGDATABASE=libromagico \
            -e RESTORE_FILE="/backups/$(basename "$RESTORE_FILE")" \
            -v "$PWD/scripts/restore.sh:/usr/local/bin/restore.sh:ro" \
            -v "$PWD/tmp-backups:/backups" \
            --entrypoint /usr/local/bin/restore.sh \
            postgres:16-alpine

      # Comprueba que los datos sembrados sobrevivieron al ciclo dump -> restore.
      - name: Verify restored data
        run: |
          count=$(docker exec pg-dst psql -U libromagico -d libromagico -tAc "SELECT count(*) FROM libros")
          echo "Filas restauradas en 'libros': $count"
          if [ "$count" != "1" ]; then
            echo "::error::La verificación del restore falló: se esperaba 1 fila, se encontraron '$count'"
            exit 1
          fi

      # Crea un dump ficticio de hace 8 días y re-corre el script con retención
      # de 7 días: comprueba que find -mtime lo elimina.
      - name: Verify retention
        run: |
          touch -d "8 days ago" tmp-backups/libromagico_old.sql.gz
          docker run --rm --network host \
            -e PGHOST=localhost -e PGPORT=5433 \
            -e PGUSER=libromagico -e PGPASSWORD=test -e PGDATABASE=libromagico \
            -e BACKUP_DIR=/backups -e BACKUP_RETENTION_DAYS=7 \
            -v "$PWD/scripts/backup.sh:/usr/local/bin/backup.sh:ro" \
            -v "$PWD/tmp-backups:/backups" \
            --entrypoint /usr/local/bin/backup.sh \
            postgres:16-alpine
          if [ -f tmp-backups/libromagico_old.sql.gz ]; then
            echo "::error::La retención no eliminó el dump viejo (libromagico_old.sql.gz)"
            exit 1
          fi

      # Limpieza idempotente por si el runner quedó con contenedores de un run anterior.
      - name: Cleanup containers and backup dir
        if: always()
        run: |
          docker rm -f pg-src pg-dst || true
          rm -rf tmp-backups
