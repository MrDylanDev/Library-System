# === PERFIL DE PRODUCCIÓN ===
# Activar: --spring.profiles.active=prod
# Las variables de entorno deben estar configuradas

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 — deshabilitado
spring.h2.console.enabled=false

# JPA — SQL oculto; esquema gestionado por Flyway, Hibernate solo valida
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# CORS — orígenes permitidos desde variable de entorno (requerida en producción)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Security — cookies httpOnly/secure en producción
app.cookie-secure=true

# Rate limiting — endpoints de autenticación (ventana deslizante por IP y email)
auth.rate-limit.enabled=true
auth.rate-limit.ip.max-attempts=60
auth.rate-limit.ip.window-minutes=1
auth.rate-limit.email.max-attempts=5
auth.rate-limit.email.window-minutes=15
# Proxies confiables: solo cuando el peer (remoteAddr) está en esta lista se
# confía en el header X-Forwarded-For (ej. IP del gateway docker); el resto de
# los peers se limita por remoteAddr. Vacío = nunca confiar en el header.
auth.rate-limit.trusted-proxies=

# Email — SMTP real
app.mail.enabled=true
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.from=${SMTP_FROM:noreply@libromagico.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
