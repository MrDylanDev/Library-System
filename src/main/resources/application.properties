# === CONFIGURACIÓN COMPARTIDA / DESARROLLO (default) ===

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Préstamo
prestamo.dias=15
prestamo.multa.monto=10.00

# JWT
jwt.secret=${JWT_SECRET:LibroMagico2024SecretKeyParaFirmarJWTMinimo256Bits!!}
jwt.expiration=86400000

# Rate limiting — endpoints de autenticación (ventana deslizante por IP y email)
auth.rate-limit.enabled=true
auth.rate-limit.ip.max-attempts=60
auth.rate-limit.ip.window-minutes=1
auth.rate-limit.email.max-attempts=5
auth.rate-limit.email.window-minutes=15
# Proxies confiables: solo cuando el peer (remoteAddr) está en esta lista se
# confía en el header X-Forwarded-For (ej. IP del gateway docker); el resto de
# los peers se limita por remoteAddr. Vacío = nunca confiar en el header.
auth.rate-limit.trusted-proxies=

# Spring JPA — el esquema lo gestiona Flyway (db/migration); Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Flyway — migraciones versionadas (src/main/resources/db/migration)
# baseline-on-migrate: si la BD ya existe (esquema creado antes de Flyway), se
# registra el baseline en V1 sin re-ejecutar la migración.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Base de datos H2 (default — para desarrollo)
spring.datasource.url=jdbc:h2:mem:libromagico
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA — SQL verbose para debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari — timeout corto de adquisición de conexión: si la BD está caída,
# las peticiones (y el healthcheck) fallan rápido en vez de esperar 30s.
spring.datasource.hikari.connection-timeout=3000

# Actuator — observabilidad mínima en dev: health (healthcheck) e info.
# metrics queda reservado al perfil prod.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Email — MailHog local
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
